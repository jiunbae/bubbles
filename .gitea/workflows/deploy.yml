name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: registry.jiun.dev
  IAC_REPO: jiunbae/IaC
  BASE_PATH: kubernetes/base/apps/bubbles
  DEV_PATH: kubernetes/overlays/dev/bubbles
  PROD_PATH: kubernetes/overlays/prod/bubbles

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  validate-iac:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      iac_sha: ${{ steps.iac-revision.outputs.sha }}
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install validator dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.4

      - name: Clone IaC repo
        run: |
          git clone https://x-access-token:${{ secrets.IAC_GITHUB_TOKEN }}@github.com/${{ env.IAC_REPO }}.git iac

      - name: Record validated IaC revision
        id: iac-revision
        run: |
          echo "sha=$(git -C iac rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate rendered dev secrets
        shell: bash
        run: |
          set -o pipefail
          kubectl kustomize "iac/${{ env.DEV_PATH }}" | node scripts/validate-iac-secrets.mjs - dev

      - name: Validate rendered prod secrets
        shell: bash
        run: |
          set -o pipefail
          kubectl kustomize "iac/${{ env.PROD_PATH }}" | node scripts/validate-iac-secrets.mjs - prod

  build-server:
    needs: [verify, validate-iac]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/bubbles-server:${{ gitea.sha }}

  build-web:
    # The self-hosted act runner shares its action cache across jobs. Running
    # both multi-arch Buildx jobs concurrently can delete another job's cached
    # action while it is starting, so serialize the image builds.
    needs: [verify, validate-iac, build-server]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/bubbles-web:${{ gitea.sha }}

  update-manifests:
    needs: [build-server, build-web, validate-iac]
    runs-on: ubuntu-latest
    steps:
      - name: Clone IaC repo
        run: |
          git clone https://x-access-token:${{ secrets.IAC_GITHUB_TOKEN }}@github.com/${{ env.IAC_REPO }}.git iac
          git -C iac checkout -B validated-main "${{ needs.validate-iac.outputs.iac_sha }}"

      - name: Update image tags
        run: |
          cd iac
          updated_files=0
          for path in "${{ env.BASE_PATH }}" "${{ env.DEV_PATH }}" "${{ env.PROD_PATH }}"; do
            file="${path}/kustomization.yaml"
            [ -f "${file}" ] || continue
            grep -qE '^[[:space:]]*newTag:' "${file}" || continue
            sed -i "s/newTag: .*/newTag: ${{ gitea.sha }}/" "${file}"
            updated_files=$((updated_files + 1))
          done
          if [ "${updated_files}" -eq 0 ]; then
            echo "No Bubbles image tags were found in the configured IaC paths" >&2
            exit 1
          fi
          git diff --check

      - name: Commit and push
        run: |
          cd iac
          git config user.name "CI Bot"
          git config user.email "ci@jiun.dev"
          git add -A
          git diff --staged --quiet || git commit -m "chore(bubbles): update image tags to ${{ gitea.sha }}"
          git push origin HEAD:main
